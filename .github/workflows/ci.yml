name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build build-essential zlib1g-dev pkg-config python3 systemd

      - name: Build and check rules, CLI and daemon
        run: make check

      - name: Build and check optimized binary
        run: |
          make release
          meson test -C build-release --print-errorlogs
          python3 tests/integration/saved-smoke.py ./build-release/fileward
          python3 tests/integration/journal-boundary.py ./build-release/fileward
          python3 tests/integration/observability-smoke.py ./build-release/fileward

      - name: Check config rule matching
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/watch"
          touch "$RUNNER_TEMP/watch/example.txt"
          printf 'watch %s/watch\nwhen created *.txt log "text file created"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/fileward.conf"
          ./build/fileward test --config "$RUNNER_TEMP/fileward.conf" "$RUNNER_TEMP/watch/example.txt" | grep -q 'Match 1:'
          ./build/fileward explain --config "$RUNNER_TEMP/fileward.conf" --event created "$RUNNER_TEMP/watch/example.txt" | grep -q 'Match 1:'
          mkdir -p "$RUNNER_TEMP/watch-other"
          touch "$RUNNER_TEMP/watch-other/example.txt"
          for command in test explain; do
            if output=$(./build/fileward "$command" --config "$RUNNER_TEMP/fileward.conf" "$RUNNER_TEMP/watch-other/example.txt" 2>&1); then
              echo "Path outside watch root was accepted by $command"
              exit 1
            fi
            grep -q 'outside watch root' <<< "$output"
          done

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build build-essential zlib1g-dev pkg-config python3 systemd
      - name: Build with ASan, UBSan and warnings as errors
        run: |
          meson setup build-asan -Db_sanitize=address,undefined -Dwerror=true
          meson compile -C build-asan
          meson test -C build-asan --print-errorlogs
      - name: Check concurrency, readiness and audit under sanitizers
        run: |
          python3 tests/integration/observability-smoke.py ./build-asan/fileward
          python3 tests/integration/control-smoke.py ./build-asan/fileward
          python3 tests/integration/saved-smoke.py ./build-asan/fileward
          python3 tests/integration/journal-boundary.py ./build-asan/fileward
