# Fileward: one example for rules and actions. Run from the repository root.
# mkdir -p ~/Downloads/FilewardLab/{inbox,staging}
# cp example.conf fileward.conf
# ./build/fileward validate --config fileward.conf
# ./build/fileward run --dry-run --config fileward.conf
# ./build/fileward run --config fileward.conf
# Prepare files in staging, then mv them into inbox while the watcher runs.
# Existing files are not processed on startup. Outputs stay outside inbox.

watch ~/Downloads/FilewardLab/inbox
mode all

# Filters match paths relative to inbox: ignore -> deny -> allow.
ignore **/*.part
ignore **/*.tmp
ignore scratch/**
deny private/**
allow **/*.pdf
allow **/*.png
allow **/*.jpg
allow **/*.txt
allow **/*.zip
allow demo-*

# Audit first. Equal priorities preserve config order.
rule arrival priority=100 type=file when moved_to ** log "[LAB] Incoming file"

# Disabled by default; enable and reload to try exec without an implicit shell.
rule show-path disabled priority=95 timeout=5s when moved_to ** exec /usr/bin/printf '%s\n' "{path}"

# Copy and gzip preserve the original for later rules. Collision suffixes keep old outputs.
rule backup priority=90 type=file conflict=rename retries=2 backoff=100ms when moved_to ** copy "~/Downloads/FilewardLab/sorted/backup/{date}/{ext}/{dir}"
rule gzip priority=80 type=file extension=txt min-size=1B max-size=20MiB conflict=rename when moved_to ** archive ~/Downloads/FilewardLab/sorted/compressed

# Specific routing before the fallback; stop prevents a second move of the same file.
rule important-pdf priority=70 stop type=file name=important-* extension=pdf min-size=1KiB max-size=10MiB max-age=7d conflict=rename when moved_to ** move ~/Downloads/FilewardLab/sorted/important
rule pdf priority=60 stop type=file extension=pdf conflict=rename when moved_to ** move ~/Downloads/FilewardLab/sorted/pdf
rule screenshots priority=50 stop type=file name=screenshot-* extension=png conflict=rename when moved_to ** move ~/Downloads/FilewardLab/sorted/screenshots
rule png priority=45 stop type=file extension=png conflict=rename when moved_to ** move ~/Downloads/FilewardLab/sorted/images
rule jpg priority=45 stop type=file extension=jpg conflict=rename when moved_to ** move ~/Downloads/FilewardLab/sorted/images

# Age is checked at event time, not by a timer. Text continues to the final move.
rule old-text priority=30 type=file extension=txt min-age=1h when moved_to ** log "[LAB] Text is at least one hour old"
rule finish priority=0 stop type=file conflict=rename when moved_to ** move "~/Downloads/FilewardLab/sorted/other/{ext}"

# Root entries named demo-* are allowed by the filters above.
rule new-directory type=directory when created ** log "[LAB] Directory created"
rule new-symlink type=symlink when created ** log "[LAB] Symlink created"
# Removal events have no file metadata; use event/path conditions here.
rule removed priority=-10 when deleted ** log "[LAB] Allowed entry deleted"
