# Fileward v0.8. Run from the repository root.
# mkdir -p ~/Downloads/FilewardActions/{inbox,staging}
# ./build/fileward validate --config example-actions.conf
# ./build/fileward run --dry-run --config example-actions.conf
# Prepare files in staging, then move them into inbox while the watcher runs.
watch ~/Downloads/FilewardActions/inbox
mode all
ignore **/*.part
ignore **/*.tmp
deny private/**

# Preserve a copy, then compress TXT files, then move the original out of inbox.
rule backup priority=30 type=file conflict=rename retries=2 backoff=100ms when moved_to ** copy "~/Downloads/FilewardActions/backup/{date}/{ext}/{dir}"
rule gzip priority=20 type=file extension=txt conflict=rename when moved_to ** archive ~/Downloads/FilewardActions/compressed

# Disabled by default. Enable to print the original path through an external utility.
rule show-path disabled priority=10 timeout=5s when moved_to ** exec /usr/bin/printf '%s\n' "{path}"
rule finish stop type=file conflict=rename when moved_to ** move "~/Downloads/FilewardActions/processed/{ext}"
